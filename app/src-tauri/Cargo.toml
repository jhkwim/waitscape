[package]
name = "waitscape"
description = "Waitscape desktop app (Tauri 2 shell): tray, widget, OS notifications, sandboxed modes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.90"
publish = false

[lib]
name = "waitscape_lib"
path = "src/lib.rs"

[[bin]]
name = "waitscape"
path = "src/main.rs"

# 빌드 플레이버(컴파일 타임 기능 스위치). 기본 = 직접 배포판(GitHub Releases): 둘 다 켜짐.
# Mac App Store용 빌드는 `--no-default-features`로 업데이터(스토어가 업데이트함)·터미널 이동(다른 앱 실행)을 뺀다 — docs/RELEASE.md '빌드 플레이버'.
# 웹 화면은 `app_info` 명령의 features로 무엇이 켜졌는지 알고 해당 UI를 숨긴다.
[features]
default = ["updater", "terminal-jump"]
# 앱 안 업데이트(tauri-plugin-updater, latest.json 확인 + minisign 서명 검증)
updater = ["dep:tauri-plugin-updater"]
# 세션 폴더에서 터미널/편집기 열기 (`open -a`, `wt -d`)
terminal-jump = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json.workspace = true

[dependencies]
wr-core = { path = "../../crates/wr-core" }
serde.workspace = true
serde_json.workspace = true
# 파일 로그 시각(applog.rs, 로컬 시각). wr-core와 같은 워크스페이스 의존성
chrono.workspace = true
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "=2.7.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"
# 🙈 눈치 모드 전역 단축키(기본 CmdOrCtrl+Shift+H). Rust에서만 등록 — 웹 쪽 권한(capabilities)은 주지 않는다
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-updater = { version = "=2.14.0", optional = true }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.11"
# MCP 연결: Codex config.toml을 주석·순서를 보존하며 고친다 (이미 tauri 의존성 트리에 있는 버전)
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
