[workspace]
resolver = "2"
members = ["crates/wr-core", "crates/wr-hook", "crates/wr-server", "app/src-tauri"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
# 1.89: 일지(wr-core daylog.rs)의 File::try_lock(flock)이 1.89에서 안정화. 의존성(icu_* 등)은 1.88, 코드는 is_none_or(1.82)·trim_ascii(1.80)도 사용.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zeroize = "1"
# MCP 보고 정화의 NFC 정규화 (report.rs). 이미 잠금 파일에 있는 버전(url/idna 경유)
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# 훅은 Claude Code가 이벤트마다 띄우므로 작고 빨라야 한다
[profile.release.package.wr-hook]
opt-level = "z"
