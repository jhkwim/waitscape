name: Rust

# 러너 시간·대기 줄이기: Rust와 그 결과에 영향을 주는 파일이 바뀔 때만 돈다(공개 저장소라 표준 러너는 무료지만 빌드가 길다).
# main push도 같은 경로일 때만 돈다 — PR은 main의 캐시만 읽을 수 있어서, main에서 한 번 돌아야 다음 PR이 캐시를 쓴다.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "server.py"
      - "daylog.py"
      - "statusline_tap.py"
      - "mcp_report.py"
      - "scripts/rust_parity.sh"
      - "scripts/compare.py"
      - "scripts/snapshot.py"
      - "scripts/build_sidecar.sh"
      - "scripts/check_transcript_only.py"
      - "scripts/third_party_licenses.py"
      - "web/fonts/**"
      - "web/modes/index.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "server.py"
      - "daylog.py"
      - "statusline_tap.py"
      - "mcp_report.py"
      - "scripts/rust_parity.sh"
      - "scripts/compare.py"
      - "scripts/snapshot.py"
      - "scripts/build_sidecar.sh"
      - "scripts/check_transcript_only.py"
      - "scripts/third_party_licenses.py"
      - "web/fonts/**"
      - "web/modes/index.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux는 린트와 테스트를 두 잡으로 나눠 동시에 돌린다(차례로 돌면 두 시간을 더한 만큼 기다림). Windows는 코어 크레이트 테스트만.
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux 린트", os: ubuntu-latest, task: lint }
          - { name: "Linux 테스트", os: ubuntu-latest, task: test }
          - { name: "Windows 테스트", os: windows-latest, task: test }
        # macOS 앱 빌드는 release.yml이 맥에서 한다(PR 검사는 Linux·Windows로 충분하고 맥 러너는 대기가 길다)
    env:
      # 앱 크레이트(app/src-tauri)의 rust-version(1.90)에 맞춰 고정. 올릴 때는 여기와 release.yml을 같이 바꾼다.
      RUST_TOOLCHAIN: "1.90.0"
      CARGO_TERM_COLOR: always
      # CI 빌드는 디버그 정보가 필요 없다: 링크가 빨라지고 캐시가 작아진다(test 프로필은 dev를 따름)
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 툴체인 고정 (rustup, 러너에 기본 설치됨)
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          extra=()
          if [ "$TASK" = lint ]; then extra=(--component rustfmt --component clippy); fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal "${extra[@]}"
          rustup default "$RUST_TOOLCHAIN"
          rustc -V

      # PR 캐시는 그 PR에서만 다시 읽을 수 있어 대부분 버려진다 → 저장은 main에서만(PR은 main 캐시를 읽기만)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.task }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --- Linux: 앱(Tauri) 포함 워크스페이스 전체 ---
      - name: Tauri 시스템 의존성 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Linux' && matrix.task == 'test'
        with:
          python-version: "3.12"

      # 린트는 필요 없다(clippy는 링크하지 않고, 파일이 없으면 build.rs가 자리표시를 만든다).
      # 테스트는 진짜 wr-hook이 필요하다: tauri-build가 sidecar를 target/debug/wr-hook로 복사하고 mcp 테스트가 그걸 실행한다
      - name: wr-hook sidecar 만들기 (테스트가 실제 wr-hook을 실행함)
        if: runner.os == 'Linux' && matrix.task == 'test'
        run: sh scripts/build_sidecar.sh

      - name: 배포물 의존성 라이선스가 허용 목록 안인지 (scripts/third_party_licenses.py, #9)
        if: matrix.task == 'lint'
        run: python3 scripts/third_party_licenses.py --check

      - name: cargo fmt --check
        if: matrix.task == 'lint'
        run: cargo fmt --all -- --check

      - name: cargo clippy (경고 = 실패)
        if: matrix.task == 'lint'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy 앱 기능 끈 빌드 (updater·terminal-jump 없이, docs/RELEASE.md '빌드 플레이버')
        if: matrix.task == 'lint'
        run: cargo clippy -p waitscape --all-targets --no-default-features -- -D warnings

      - name: cargo test --workspace
        if: runner.os == 'Linux' && matrix.task == 'test'
        run: cargo test --workspace

      - name: Python 기준 결과와 동등성 (23/23, MCP 보고 포함) + 트랜스크립트 전용 (24/24)
        if: runner.os == 'Linux' && matrix.task == 'test'
        run: sh scripts/rust_parity.sh

      # --- Windows: 앱을 뺀 코어 크레이트만 (앱은 릴리스 워크플로가 빌드) ---
      # 기준 결과(fixtures/expected)는 Asia/Seoul 기준 '오늘'이다. Unix는 테스트가 TZ 환경변수를 읽지만 Windows의 chrono는 시스템 시간대를 쓰므로 맞춰 준다.
      - name: 시스템 시간대를 fixture와 같게 (Windows)
        if: runner.os == 'Windows'
        run: tzutil /s "Korea Standard Time"

      - name: cargo test (wr-core·wr-hook·wr-server)
        if: runner.os == 'Windows'
        run: cargo test -p wr-core -p wr-hook -p wr-server
