name: Release

# 태그 v* 푸시 → 빌드 + 초안(draft) 릴리스. 수동 실행은 기본으로 아티팩트만 만든다(publish=false).
# 보통은 release-prep.yml이 부른다: 버전 PR 병합 → 태그 vX.Y.Z → 이 워크플로를 그 태그로 workflow_dispatch(ref_type=tag라 초안까지 만듦).
# 이 워크플로가 만드는 설치 파일은 미서명이다(Apple·Windows 코드 서명은 시크릿이 있을 때만). 안내: docs/INSTALL.md
# 업데이터 서명(minisign)·latest.json도 시크릿이 있을 때만 만든다. 흐름 전체: docs/RELEASE.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "초안 릴리스까지 만들기 (기본 false = 아티팩트만)"
        type: boolean
        default: false
      tag:
        description: "publish=true일 때 릴리스 태그 (예: v0.1.0)"
        type: string
        required: false

permissions:
  contents: read

env:
  # 설치·업데이트 위치 = 이 저장소의 GitHub Releases(latest.json의 내려받기 주소도 여기). 0.4.0까지는 배포 전용 저장소였다(#22).
  RELEASES_REPO: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 수동 실행을 태그(v*)·main으로 제한하는 실수 방지용 검사다. 보안 경계는 release 환경의 배포 규칙(태그 v*·main)이고, 이 잡은 그 앞에서 이유를 보여 줄 뿐이다.
  guard:
    name: 실행 ref 확인
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 태그 v* 또는 main인지
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v* | refs/heads/main) echo "ref: $REF" ;;
            *) echo "::error::release.yml은 태그 v* 또는 main에서만 실행한다 (지금: $REF)"; exit 1 ;;
          esac

  build:
    name: 빌드 (${{ matrix.name }})
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90 # 공증(앱·dmg) 대기 포함
    # 서명 시크릿은 release 환경에만 둔다(배포 브랜치 규칙: 태그 v*·main). docs/RELEASE.md §5
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle_dir: target/universal-apple-darwin/release/bundle
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis,msi
            bundle_dir: target/release/bundle
    env:
      RUST_TOOLCHAIN: "1.90.0" # ci.yml과 같이 올린다
      TAURI_CLI_VERSION: "2.12.4" # npm @tauri-apps/cli (tauri 크레이트 버전과 맞춤). Dependabot이 보지 않으니 tauri 크레이트를 올릴 때 손으로 같이 올린다
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 버전 일치 검사 (Cargo workspace = tauri.conf.json, 태그 푸시면 태그도)
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          conf_v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "Cargo=$cargo_v tauri.conf=$conf_v"
          [ "$cargo_v" = "$conf_v" ] || { echo "::error::Cargo.toml($cargo_v)과 tauri.conf.json($conf_v) 버전이 다르다"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            [ "v$cargo_v" = "$REF_NAME" ] || { echo "::error::태그($REF_NAME)와 앱 버전(v$cargo_v)이 다르다"; exit 1; }
          fi

      - name: Rust 툴체인 고정
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
          rustc -V

      # 태그 실행이 저장한 캐시는 다음 태그가 읽을 수 없다(캐시는 같은 ref·기본 브랜치에서만 공유). 저장은 main 수동 실행에서만.
      # 보통 흐름(release-prep → 태그로 dispatch)에서는 저장하지 않으므로 릴리스 빌드는 대개 캐시 없이 돈다
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 서명 자리: release 환경 시크릿이 있을 때만 켠다. 없으면 미서명(맥은 ad-hoc)으로 빌드한다.
      # 맥: APPLE_CERTIFICATE(base64 Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #     공증은 App Store Connect API 키(권장: APPLE_API_ISSUER·APPLE_API_KEY·APPLE_API_KEY_P8) 또는 APPLE_ID·APPLE_PASSWORD(앱 암호)·APPLE_TEAM_ID.
      #     윈도우 코드 서명은 아직 자리만(docs/INSTALL.md '한계'). 절차: docs/RELEASE.md §5.1
      # 이 스텝은 있는지만 보고 on/notarize를 출력한다(시크릿 값은 받지 않음). 값은 Tauri 빌드 스텝 env:에서만 조건부로 넣는다.
      - name: 서명 설정 (시크릿이 있을 때만)
        id: apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_API: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLEID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$HAS_CERT" = true ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            # 공증 인증: API 키가 있으면 그것(앱 암호보다 권한이 좁고 따로 폐기 가능), 없으면 Apple ID
            how=none
            if [ "$HAS_API" = true ]; then how=api; elif [ "$HAS_APPLEID" = true ]; then how=appleid; fi
            if [ "$how" != none ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; echo "notarize_how=$how" >> "$GITHUB_OUTPUT"; fi
            echo "서명: 켜짐 (공증: $how)"
          else
            echo "서명: 시크릿 없음 -> 미서명(ad-hoc)으로 빌드"
          fi

      # 업데이터 서명(tauri-plugin-updater, minisign 키) — 위의 Apple 코드 서명과 별개다.
      # release 환경 시크릿 TAURI_SIGNING_PRIVATE_KEY(+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD)가 있고 tauri.conf.json의 plugins.updater.pubkey가
      # 실제 공개 키일 때만 updater 산출물(.app.tar.gz·.sig, .exe.sig·.msi.sig)을 만든다. 아니면 이 부분만 건너뛰고 빌드는 그대로 성공한다.
      - name: 업데이터 서명 설정 (시크릿이 있을 때만)
        id: updater
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pk=$(node -p "((require('./app/src-tauri/tauri.conf.json').plugins || {}).updater || {}).pubkey || ''")
          if [ "$HAS_KEY" != true ]; then
            echo "업데이터 서명: 시크릿 없음 -> 건너뜀 (latest.json 없음)"
            exit 0
          fi
          case "$pk" in
            "" | *REPLACE_WITH*)
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY는 있지만 tauri.conf.json의 plugins.updater.pubkey가 자리표시자다. 공개 키를 넣기 전에는 업데이터 서명을 건너뛴다 (docs/RELEASE.md)"
              exit 0
              ;;
          esac
          # tauri.conf.json의 기본값(false, 로컬 빌드가 키 없이 되게)을 이 빌드에서만 덮어쓴다
          printf '{"bundle":{"createUpdaterArtifacts":true}}\n' > app/src-tauri/ci-updater.conf.json
          echo "on=true" >> "$GITHUB_OUTPUT"
          echo "업데이터 서명: 켜짐"

      # 오픈소스 라이선스 고지(앱 번들 리소스, 설정 → 앱 정보 → 오픈소스 라이선스). 허용 목록 밖 라이선스면 여기서 실패 (#9)
      - name: 오픈소스 라이선스 고지 만들기
        shell: bash
        env:
          PYTHONUTF8: "1" # Windows 러너 기본 인코딩(cp1252)으로 한글·cargo JSON을 읽다 죽지 않게
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          "$py" scripts/third_party_licenses.py --out app/src-tauri/THIRD_PARTY_LICENSES.html

      # wr-hook sidecar는 tauri.conf.json의 beforeBuildCommand(scripts/build_sidecar.sh)가 대상 triple별로 만든다.
      - name: Tauri 빌드
        shell: bash
        working-directory: app/src-tauri
        env:
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.on == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Apple 코드 서명·공증: 판정 스텝이 켰을 때만 값이 들어간다. base64 인증서의 줄바꿈은 Tauri(tauri-macos-sign)가 디코딩 전에 지운다.
          APPLE_ON: ${{ steps.apple.outputs.on }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          APPLE_CERTIFICATE: ${{ steps.apple.outputs.on == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.apple.outputs.on == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.on == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          NOTARIZE_HOW: ${{ steps.apple.outputs.notarize_how }}
          APPLE_ID: ${{ steps.apple.outputs.notarize_how == 'appleid' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.apple.outputs.notarize_how == 'appleid' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.apple.outputs.notarize_how == 'appleid' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.notarize_how == 'api' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ steps.apple.outputs.notarize_how == 'api' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_P8: ${{ steps.apple.outputs.notarize_how == 'api' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          # Tauri는 빈 문자열도 "설정됨"으로 본다(빈 APPLE_SIGNING_IDENTITY가 ad-hoc "-"를 덮어씀). 꺼진 쪽은 변수 자체를 지운다.
          # 인증서 암호는 서명이 켜졌으면 비어 있어도 남긴다(암호 없는 .p12).
          if [ "$APPLE_ON" != true ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; fi
          if [ "$NOTARIZE_HOW" != appleid ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          if [ "$NOTARIZE_HOW" = api ]; then
            # Tauri는 API 키를 파일 경로(APPLE_API_KEY_PATH)로 받는다. 러너 임시 폴더에만 두고 빌드 뒤 지운다
            # umask는 키 파일에만(빌드 전체에 걸면 앱 파일 권한이 소유자 전용이 됨)
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            trap 'rm -f "$key"' EXIT
            ( umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key" )
            export APPLE_API_KEY_PATH="$key"
          else
            unset APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_KEY_P8
          extra=()
          if [ "$UPDATER_ON" = true ]; then extra=(--config ci-updater.conf.json); fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build ${{ matrix.args }} "${extra[@]}"
          # Tauri는 .app만 공증·스테이플하고 .dmg는 서명만 한다. 가장 바깥 용기(dmg)도 공증해 내려받은 dmg가 바로 통과하게 한다
          if [ "$RUNNER_OS" = macOS ] && [ -n "$NOTARIZE_HOW" ]; then
            dmg=$(ls "../../$BUNDLE_DIR"/dmg/*.dmg)
            if [ "$NOTARIZE_HOW" = api ]; then
              auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
            else
              auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
            fi
            res=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)
            st=$(jq -r .status <<<"$res")
            echo "dmg 공증: $st ($(jq -r .id <<<"$res"))"
            [ "$st" = Accepted ] || { echo "::error::dmg 공증 실패: $st (xcrun notarytool log <id>로 이유 확인)"; exit 1; }
            xcrun stapler staple "$dmg"
          fi

      # 서명·공증이 실제로 됐는지 빌드 결과로 확인한다(시크릿이 있는데 조용히 미서명으로 나가지 않게)
      - name: 맥 서명·공증 확인
        if: runner.os == 'macOS' && steps.apple.outputs.on == 'true'
        shell: bash
        env:
          APP: ${{ matrix.bundle_dir }}/macos/Waitscape.app
          APPLE_NOTARIZE: ${{ steps.apple.outputs.notarize }}
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict "$APP/Contents/MacOS/wr-hook"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)' || true
          # grep -q가 파이프를 일찍 닫으면 pipefail로 거짓 실패하므로 출력을 먼저 받는다
          info=$(codesign -dv "$APP" 2>&1)
          grep -q 'flags=.*runtime' <<<"$info" || { echo "::error::hardened runtime이 꺼져 있다(공증 불가)"; exit 1; }
          spctl --status || true
          if [ "$APPLE_NOTARIZE" = true ]; then
            xcrun stapler validate "$APP"
            out=$(spctl -a -vv -t exec "$APP" 2>&1) || true
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<<"$out" || { echo "::error::Gatekeeper가 공증된 앱으로 보지 않는다"; exit 1; }
            dmg=$(ls "$(dirname "$(dirname "$APP")")"/dmg/*.dmg)
            xcrun stapler validate "$dmg"
            out=$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1) || true
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<<"$out" || { echo "::error::dmg가 공증된 것으로 보이지 않는다"; exit 1; }
            # 앱 안 업데이트 묶음(.app.tar.gz)에 든 앱도 공증 티켓이 붙은 것인지 (묶음을 공증 전에 만들면 업데이트한 앱이 막힘)
            tgz="$(dirname "$APP")/Waitscape.app.tar.gz"
            if [ -f "$tgz" ]; then
              t="$RUNNER_TEMP/upd"; rm -rf "$t"; mkdir -p "$t"; tar -xzf "$tgz" -C "$t"
              xcrun stapler validate "$t/Waitscape.app"
              codesign --verify --deep --strict "$t/Waitscape.app"
            fi
          else
            spctl -a -vv -t exec "$APP" || echo "::warning::서명은 됐지만 공증이 없어 Gatekeeper는 여전히 막는다"
          fi

      - name: 산출물 모으기 + SHA-256
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          PLATFORM: ${{ matrix.name }}
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          APPLE_ON: ${{ steps.apple.outputs.on }}
          APPLE_NOTARIZE: ${{ steps.apple.outputs.notarize }}
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$BUNDLE_DIR"/dmg/*.dmg out/
            ditto -c -k --keepParent "$BUNDLE_DIR"/macos/Waitscape.app out/Waitscape-macos-universal.app.zip
            if [ "$UPDATER_ON" = true ]; then
              # 업데이터가 내려받는 묶음 + 서명 (latest.json의 darwin-* 항목)
              cp "$BUNDLE_DIR"/macos/Waitscape.app.tar.gz out/Waitscape-macos-universal.app.tar.gz
              cp "$BUNDLE_DIR"/macos/Waitscape.app.tar.gz.sig out/Waitscape-macos-universal.app.tar.gz.sig
            fi
          else
            cp "$BUNDLE_DIR"/nsis/*.exe "$BUNDLE_DIR"/msi/*.msi out/
            if [ "$UPDATER_ON" = true ]; then
              # v2 방식: 설치 파일 자체가 업데이트 묶음이고 옆에 .sig (latest.json의 windows-* 항목)
              cp "$BUNDLE_DIR"/nsis/*.exe.sig "$BUNDLE_DIR"/msi/*.msi.sig out/
            fi
          fi
          cd out
          if command -v sha256sum >/dev/null; then sha256sum -- * > ../sums.tmp; else shasum -a 256 -- * > ../sums.tmp; fi
          mv ../sums.tmp "SHA256SUMS-$RUNNER_OS.part"
          cat "SHA256SUMS-$RUNNER_OS.part"
          {
            echo "### $PLATFORM"
            echo '| 파일 | 크기 |'
            echo '|---|---|'
            for f in *; do case "$f" in *.part) continue ;; esac; printf '| %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)"; done
          } >> "$GITHUB_STEP_SUMMARY"
          # 맥 서명 상태를 초안 잡에 넘긴다(릴리스 노트 문구용, 릴리스에 올리지 않음). none | signed | notarized
          if [ "$RUNNER_OS" = macOS ]; then
            st=none
            if [ "$APPLE_ON" = true ]; then st=signed; fi
            if [ "$APPLE_ON" = true ] && [ "$APPLE_NOTARIZE" = true ]; then st=notarized; fi
            echo "$st" > macos-signing.flag
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waitscape-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: 초안 릴리스 만들기
    needs: build
    # 태그 푸시거나, 수동 실행에서 publish=true일 때만
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 이 잡에서만
    steps:
      # 릴리스 노트(CHANGELOG)와 latest.json 생성 스크립트만 쓴다 (빌드한 커밋 그대로)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          merge-multiple: true

      - name: 체크섬 합치기 + 초안 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          [ -n "$TAG" ] || { echo "::error::publish=true면 tag 입력이 필요하다"; exit 1; }
          cd dl
          cat -- *.part > SHA256SUMS.txt
          rm -f -- *.part
          sha256sum -c SHA256SUMS.txt
          mac_sign=$(cat macos-signing.flag 2>/dev/null || echo none)
          rm -f -- *.flag
          # 바뀐 점: CHANGELOG.md의 그 버전 절 (scripts/version.py bump가 만든 것). 없으면 비워 둔다
          python3 ../src/scripts/version.py --root ../src notes "$TAG" > ../changes.md
          # 앱 안 업데이트 매니페스트: 서명(.sig)이 있을 때만. 종료 코드 3 = 서명 없는 빌드라 건너뜀
          rc=0
          python3 ../src/scripts/make_latest_json.py --dir . --tag "$TAG" --repo "$RELEASES_REPO" \
            --notes-file ../changes.md --out latest.json || rc=$?
          if [ "$rc" = 3 ]; then echo "latest.json: 업데이터 서명 없음 -> 건너뜀"; elif [ "$rc" != 0 ]; then exit "$rc"; fi
          {
            # 서명 안내: 맥은 이번 빌드의 Apple 서명·공증 여부에 따라, 윈도우는 아직 항상 미서명
            case "$mac_sign" in
              notarized)
                echo "> macOS 설치 파일은 **Developer ID로 서명·공증됐다.** Windows 설치 파일은 서명되지 않아 처음 열 때 SmartScreen 경고가 나온다."
                echo ">"
                echo "> The macOS build is **signed and notarized**. The Windows build is unsigned (SmartScreen may warn)." ;;
              signed)
                echo "> macOS 설치 파일은 **서명됐지만 공증되지 않았다**(Gatekeeper 경고가 나올 수 있다). Windows 설치 파일은 서명되지 않아 SmartScreen 경고가 나온다."
                echo ">"
                echo "> The macOS build is **signed but not notarized**; the Windows build is unsigned." ;;
              *)
                echo "> 이 설치 파일은 **서명·공증되지 않았다.** 처음 열 때 macOS Gatekeeper / Windows SmartScreen 경고가 나온다."
                echo ">"
                echo "> This build is **unsigned and not notarized**." ;;
            esac
            cat <<'NOTES'
          > 여는 방법과 SHA-256 확인법은 [설치 안내](https://github.com/jhkwim/waitscape/blob/main/docs/INSTALL.md) / See the install guide for how to open it and verify checksums.

          파일: macOS universal(.dmg, .app.zip) · Windows x64(NSIS .exe, .msi) · SHA256SUMS.txt
          NOTES
            if [ -f latest.json ]; then
              echo
              echo "앱 안 업데이트: latest.json·.app.tar.gz·.sig 포함. **게시(Publish)하면** 그때부터 설치된 앱이 이 버전을 찾는다(초안은 보이지 않음)."
            fi
            if [ -s ../changes.md ]; then
              echo
              echo "## 바뀐 점"
              echo
              cat ../changes.md
            fi
          } > notes.md
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.msi *.tar.gz *.sig SHA256SUMS.txt)
          if [ -f latest.json ]; then files+=(latest.json); fi
          printf '올릴 파일: %s\n' "${files[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "Waitscape $TAG" --notes-file notes.md -- "${files[@]}"
