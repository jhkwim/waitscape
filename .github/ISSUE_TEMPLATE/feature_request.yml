name: "✨ 기능 제안 / Feature request"
description: "새 기능이나 개선 아이디어 / Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        새 화면 모드를 만들었다면 **모드 제출** 템플릿을, 다른 AI 도구 지원 요청은 **프로바이더 요청** 템플릿을 써 주세요.
        For a new screen mode use **Mode submission**; for another AI tool use **Provider request**.
  - type: textarea
    id: problem
    attributes:
      label: "어떤 문제를 풀고 싶나요? / What problem does this solve?"
      description: "기다리는 동안 무엇이 불편한지 / What's frustrating while you wait?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "제안 / Proposal"
      description: "원하는 동작, 화면 스케치 / Desired behavior, sketches welcome"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "다른 방법 / Alternatives considered"
  - type: dropdown
    id: area
    attributes:
      label: "영역 / Area"
      multiple: true
      options:
        - "모드 / Mode"
        - "코어 / Core"
        - "백엔드 / Backend"
        - "프로바이더 / Provider"
        - "데스크톱 앱 (Tauri) / Desktop app"
        - "문서 / Docs"
  - type: checkboxes
    id: privacy
    attributes:
      label: "개인정보·외부 통신 / Privacy & network"
      description: "Waitscape는 기본적으로 외부 통신이 없습니다(ARCHITECTURE.md §7.1). / Waitscape makes no network calls by default."
      options:
        - label: "이 기능은 새 외부 통신이 필요해요 (필요하면 대상·보내는 데이터를 위에 적어 주세요) / This needs a new network call (describe target & data above)"
        - label: "직접 구현해 볼 의향이 있어요 / I'd like to implement this"
